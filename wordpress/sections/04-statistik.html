<!-- ======================================================================
     Manggoes Section 4: Statistik (#mg-statistik)
     Panduan Elementor:
     1. Buat Container Elementor baru (Width: Full Width / 100%, Padding: 0, Margin: 0).
     2. Masukkan widget 'HTML' ke dalam container tersebut.
     3. Salin dan tempel seluruh kode di bawah ini ke dalam widget HTML.
     ====================================================================== -->
<div class="mg">
<section id="mg-statistik" class="mg-stats-section" aria-label="Statistik Kebun Manggoes">
        <div class="mg-container">
          <div class="mg-stats-bar mg-reveal">
            <div class="mg-stats-grid">

              <!-- Stat 1: Luas Kebun -->
              <!-- PLACEHOLDER: replace with client data - Luas kebun binaan -->
              <div class="mg-stat-item">
                <div class="mg-stat-item__icon" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                  </svg>
                </div>
                <div class="mg-stat-item__content">
                  <div class="mg-stat-item__value">
                    <span class="mg-stat-count" data-target="250">250</span><span class="mg-stat-unit">+ ha</span>
                  </div>
                  <div class="mg-stat-item__label">Luas kebun binaan</div>
                </div>
              </div>

              <!-- Stat 2: Hasil Panen -->
              <!-- PLACEHOLDER: replace with client data - Hasil panen tahunan -->
              <div class="mg-stat-item">
                <div class="mg-stat-item__icon" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                  </svg>
                </div>
                <div class="mg-stat-item__content">
                  <div class="mg-stat-item__value">
                    <span class="mg-stat-count" data-target="25000">25.000</span><span class="mg-stat-unit">+ ton</span>
                  </div>
                  <div class="mg-stat-item__label">Panen per tahun</div>
                </div>
              </div>

              <!-- Stat 3: Pengalaman -->
              <!-- PLACEHOLDER: replace with client data - Tahun pengalaman budidaya -->
              <div class="mg-stat-item">
                <div class="mg-stat-item__icon" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </div>
                <div class="mg-stat-item__content">
                  <div class="mg-stat-item__value">
                    <span class="mg-stat-count" data-target="15">15</span><span class="mg-stat-unit">+ thn</span>
                  </div>
                  <div class="mg-stat-item__label">Pengalaman budidaya</div>
                </div>
              </div>

              <!-- Stat 4: Mitra Distribusi -->
              <!-- PLACEHOLDER: replace with client data - Jumlah mitra ritel/kuliner -->
              <div class="mg-stat-item">
                <div class="mg-stat-item__icon" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                  </svg>
                </div>
                <div class="mg-stat-item__content">
                  <div class="mg-stat-item__value">
                    <span class="mg-stat-count" data-target="100">100</span><span class="mg-stat-unit">+ mitra</span>
                  </div>
                  <div class="mg-stat-item__label">Mitra distribusi</div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </section>
</div>
